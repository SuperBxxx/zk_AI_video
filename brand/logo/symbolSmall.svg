<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 标志符号（小尺寸简化版）</title>
  <!--
    小尺寸简化版 —— 专供 16px 及以下（favicon、列表图标、极小界面元素）。

    为什么需要它：真彩色抗锯齿实测显示，完整版在 96/64/48/32px 清晰，
    **16px 可辨但中心准星开始糊**。所以 16px 以下砍掉准星，只留四角。

    与主版的差别（两处，都是有依据的）：
      1. 去掉中心准星 —— 16px 下它只剩约 1px，必然糊成灰点，反而降低清晰度
      2. 缺口由 96 收窄到 76 —— 准星去掉后四角要承担全部识别，
         缺口太大在极小尺寸下会让四个角"散开"、不成一体

    几何:
      外沿 32..224（192 见方），四边留白 32（与主版一致，保持视觉 DNA）
      四角：臂长 68、厚 24，各边缺口 76
      全部为 4 的倍数
  -->
  <g fill="currentColor">
    <rect x="32" y="32" width="68" height="24" />
    <rect x="32" y="56" width="24" height="44" />
    <rect x="156" y="32" width="68" height="24" />
    <rect x="200" y="56" width="24" height="44" />
    <rect x="32" y="200" width="68" height="24" />
    <rect x="32" y="156" width="24" height="44" />
    <rect x="156" y="200" width="68" height="24" />
    <rect x="200" y="156" width="24" height="44" />
  </g>
</svg>

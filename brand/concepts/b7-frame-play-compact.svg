<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — logo · 框与三角</title>
  <!--
    Logo — 框与三角 (Frame & Play) · abstract

    Idea: 一个画框，右下角整段缺席 —— 画布是开放的、没有边界；
          框内切出视频三角，指向那个开口，即"从想法到成片"的出口。

    构造:
      外沿 56..248（边长 192），边宽 30。四边留白均为 56 —— 对称居中。
      标记占 192/256 = 75%（bbox fill 0.562）。
      右下缺口：底边止于 x218、右边止于 y188，缺口 30 见方（与边宽同值，缺掉一整个角）。
      内区 86..218（132 见方）。

      形状由四段实心矩形拼成（上 / 左 / 右 / 下），
      这样每段都是直角矩形，不必依赖 even-odd 的绕向，也不会写出斜线：
        上  (56,56)-(248,86)
        左  (56,86)-(86,248)
        右  (218,86)-(248,188)
        下  (86,218)-(218,248)

      三角：底边竖直在左、顶点朝右、指向缺口。
        底 x122，y112..190（高 78）；顶点 (167,151)。
        顶角 θ = 2·atan(45/78) = 59.9°，与标准播放键锐度一致。
        角度按 tan(θ/2) = 半底 / 高 反算，不用估角 ——
        前几稿分别栽在 87.6° 与 46.2°，都是手工估角的后果。

      三角四周留白：左 36、右 51、上 26、下 28。
        右侧刻意留最多 —— 三角指向缺口，那是出口，需要呼吸。
    v7: v6 的复合路径把底边写丢了（从 (218,86) 直接斜连到 (86,248)），
        审计测到的下侧 8、右侧 8 就是那条斜线的包围盒。
        现在改用四段矩形，几何一目了然。
  -->
  <g fill="#000" fill-rule="evenodd">
    <!-- 上 -->
    <path d="M56 56 H248 V86 H56 Z" />
    <!-- 左 -->
    <path d="M56 86 H86 V248 H56 Z" />
    <!-- 右（到缺口处为止） -->
    <path d="M218 86 H248 V188 H218 Z" />
    <!-- 下（到缺口处为止） -->
    <path d="M86 218 H218 V248 H86 Z" />
    <!-- 三角（负空间） -->
    <path d="M122 112 L167 151 L122 190 Z" />
  </g>
</svg>

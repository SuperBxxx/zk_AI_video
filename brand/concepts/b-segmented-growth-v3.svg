<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept B · 分节生长</title>
  <!--
    Concept B — 分节生长 (Segmented Growth) · abstract
    Idea: 三根等宽竖条被横向节缝断开 —— 像竹节，也像由左至右逐段推进的时间轴。
          高度按 4:3:2 递进，读作"走得越远越接近成片"。
    构造:
      条宽 48，水平间隙 28；外沿 44..212（居中，左右各 44）。
      顶端均自 y=40 起，高度 176 / 132 / 88 —— 即 4:3:2（各差 44）。
      节缝 12（条宽的 1/4），圆角 8。
      节缝位置自左向右依次上移（距顶 110 / 92 / 62），形成一条斜向的视线引导，
      而不是三根一模一样的断条。
    v2: v1 的三根高度 160/128/96 比例接近、且底边对齐，节奏发闷；
        节缝位置也过于接近。现改为 4:3:2 递进 + 节缝斜向递进。
    v3: v2 的顶端同为 40、底端 40/84/128，整体偏上不居中。
        现在底端统一为 216，顶端 40/84/128，边界对称（上下各 40）。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000">
    <!-- 第一条：176（顶端 40） -->
    <rect x="44" y="40" width="48" height="102" rx="8" />
    <rect x="44" y="154" width="48" height="62" rx="8" />
    <!-- 第二条：132（顶端 84），节缝位置较左条上移 -->
    <rect x="120" y="84" width="48" height="80" rx="8" />
    <rect x="120" y="176" width="48" height="40" rx="8" />
    <!-- 第三条：88（顶端 128），节缝最靠上，末段最短 -->
    <rect x="196" y="128" width="48" height="42" rx="8" />
    <rect x="196" y="182" width="48" height="34" rx="8" />
  </g>
</svg>

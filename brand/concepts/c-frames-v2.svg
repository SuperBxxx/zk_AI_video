<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept C · 画格</title>
  <!--
    Concept C — 画格 (Frames) · abstract
    Idea: 2×2 四格，一格压成实心 —— 画布被分成四块分镜，实心那块是"当前正在画的一格"。
    构造: 四格外沿 48..208（即 160×160，居中）。每格 64×64，格间隙 32。
          轮廓描边 16（= 64 的 1/4），实心块与描边同厚，粗细统一。
          直角，与画布的硬边一致。
    v2: v1 的实心块用了 72、而轮廓网格是 52，导致外框左边 40 / 右边 206 不对称。
        现在四格统一 64×64，外沿对称居中。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="none" stroke="#000" stroke-width="16">
    <rect x="56" y="56" width="48" height="48" />
    <rect x="152" y="56" width="48" height="48" />
    <rect x="56" y="152" width="48" height="48" />
    <rect x="152" y="152" width="48" height="48" />
  </g>
  <rect x="48" y="48" width="64" height="64" fill="#000" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — logo · 框与三角</title>
  <!--
    Logo — 框与三角 (Frame & Play) · abstract

    Idea: 一个画框，右下角整段缺席 —— 画布是开放的、没有边界；
          框内切出视频三角，指向那个开口，即"从想法到成片"的出口。

    构造:
      外沿 44..236（边长 192），边宽 30。
      画布留白 44；标记占 192/256 = 75%。
      右下缺口：底边止于 x206、右边止于 y176，缺口 30 见方（与边宽同值，缺掉一整个角）。
      内区 74..206（132 见方）。

      三角：底边竖直在左、顶点朝右、指向缺口。
        底 x110，y100..178（高 78）；顶点 (155,139)。
        顶角 θ = 2·atan(45/78) = 59.9°，与标准播放键的锐度一致。
        角度按 tan(θ/2) = 半底 / 高 反算得出，不用"看着差不多"的数 ——
        前几稿分别栽在 87.6° 和 46.2° 上，都是手工估角造成的。

      三角四周留白：左 36、右 51、上 26、下 28。
        右侧刻意留最多 —— 三角指向缺口，那是出口，需要呼吸。
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M44 44 H236 V176 H206 V74 H74 V236 H44 Z
    M110 100 L155 139 L110 178 Z
  " />
</svg>

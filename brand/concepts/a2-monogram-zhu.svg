<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept A · 住字标</title>
  <!--
    Concept A — 住 (geometric monogram) · letterform
    Idea: 把「住」压成纯几何块面：左偏旁「亻」是一根带短撇的竖；右旁保留
          「主」的骨架（顶横 + 中横 + 竖）。观者不一定逐笔认出「住」，
          但会读到"一个方块字"，而方块字 + 方画布正是这个产品的底色。
    构造:
      笔画厚度统一 24（= 256 的 3/32，16px 下约 1.5px，仍可见）。
      外沿 48..208（左右各 48）。直角，不用圆角 —— 与画布的硬边一致。
      左偏旁竖笔 x 48..72，y 72..208；短撇是一枚 45° 的平行四边形，接在竖笔顶端。
      右旁：顶横 y 72..96（x 96..208）、中横 y 128..152（x 96..184）、竖笔 x 152..176（y 96..208）。
      中横比顶横短，竖笔落在中横偏右 —— 这是「主」的骨架，不是均匀网格。
    v1。黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000">
    <!-- 亻：竖 -->
    <rect x="48" y="72" width="24" height="136" />
    <!-- 亻：撇（45° 平行四边形，自左上接入竖笔顶端） -->
    <path d="M48 72 L72 48 L88 64 L64 88 Z" />
    <!-- 主：顶横 -->
    <rect x="96" y="72" width="112" height="24" />
    <!-- 主：中横（较短） -->
    <rect x="96" y="128" width="88" height="24" />
    <!-- 主：竖（落在中横偏右） -->
    <rect x="152" y="96" width="24" height="112" />
  </g>
</svg>

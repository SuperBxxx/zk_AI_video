<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept C · 帧序</title>
  <!--
    Concept C — 帧序 (Frame Sequence) · abstract
    Idea: 三个画框沿对角线错位叠放，最后一个是完整的 —— 前面的是走过的分镜，
          完整的那一个是"当前这一格"。用帧本身的几何讲序列，不用胶片、不用播放键。
    构造:
      三个 128×128 的方框，描边 20，右上角圆角 20（其余直角）——
      圆角只切一角，是"当前帧"的记号，也让三个框叠放时不互相咬合。
      位置：最远 (48,48) → 中间 (88,88) → 完整 (128,128)。
      描边用"外框减内孔"的复合路径实现，保证是填充面而不是 stroke ——
      这样在 16px 与单色裁切下都不会糊掉。
    v1。黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000" fill-rule="evenodd">
    <!-- 最远的帧：只留左上两段（被后面的帧遮住的部分不画，避免叠色） -->
    <path d="M48 48 H128 V68 H68 V128 H48 Z" />
    <!-- 中间的帧 -->
    <path d="M88 88 H168 V108 H108 V168 H88 Z" />
    <!-- 完整帧（当前格），右上角圆角 -->
    <path d="M128 128 H236 V148 H148 V236 H128 Z" />
  </g>
</svg>

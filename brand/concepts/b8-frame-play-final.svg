<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — logo · 框与三角</title>
  <!--
    Logo — 框与三角 (Frame & Play) · abstract

    Idea: 一个画框，右下角整段缺席 —— 画布是开放的、没有边界；
          框内切出视频三角，指向那个开口，即"从想法到成片"的出口。

    构造:
      外沿 32..224（边长 192），边宽 30。四边留白均为 32 —— 居中。
      标记占 192/256 = 75%。
      右下缺口：底边止于 x194、右边止于 y164，缺口 30 见方（与边宽同值，缺掉一整个角）。
      内区 62..194（132 见方）。

      形状由四段实心矩形拼成（上 / 左 / 右 / 下），每段都是直角矩形：
        上  (32,32)-(224,62)
        左  (32,62)-(62,224)
        右  (194,62)-(224,164)
        下  (62,194)-(194,224)

      三角：底边竖直在左、顶点朝右、指向缺口。
        底 x98，y88..166（高 78）；顶点 (143,127)。
        顶角 θ = 2·atan(45/78) = 59.9°，与标准播放键锐度一致。
        角度按 tan(θ/2) = 半底 / 高 反算 —— 前几稿栽在 87.6° 与 46.2°，
        都是手工估角的后果。
        顶点 y=127 与内区垂直中心 (62+194)/2 = 128 对齐（取整差 1）。

      三角四周留白：左 36、右 51、上 26、下 28。
        右侧刻意留最多 —— 三角指向缺口，那是出口，需要呼吸。

    v8: v7 的标记整体偏右下（实测外沿在 56..248，右/下留白仅 8）。
        现平移 −24，四边留白均匀为 32。
  -->
  <g fill="#000" fill-rule="evenodd">
    <path d="M32 32 H224 V62 H32 Z" />
    <path d="M32 62 H62 V224 H32 Z" />
    <path d="M194 62 H224 V164 H194 Z" />
    <path d="M62 194 H194 V224 H62 Z" />
    <path d="M98 88 L143 127 L98 166 Z" />
  </g>
</svg>

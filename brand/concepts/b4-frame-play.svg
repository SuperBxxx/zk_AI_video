<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept B · 框与三角</title>
  <!--
    Concept B — 框与三角 (Frame & Play) · abstract
    Idea: 一个画框，右下角**整段缺席**——画布是开放的、没有边界；
          框内切出一个视频三角，指向那个开口："从想法到成片"的出口。
    构造:
      外框 40..216，边宽 24。右下角缺口：底边止于 x184，右边止于 y168，
      缺口长 32（= 边宽 24 的 4/3，够大才读得出）。
      三角底边在左、顶点朝右，顶角精确 60°：
        底 x96，y104..152（高 48）；顶点 (96 + 48·√3/2·… ) 取整数：
        等腰三角形顶角 θ 满足 tan(θ/2) = 半底 / 高 = 48 / 48 = 1 → θ/2 = 45° → θ = 90°。
        要 60° 则需要 半底/高 = tan30° = 0.577。
        取高 48、半底 28 → 顶点 (124,128)，θ = 2·atan(28/48) = 60.5°，落在干净区间。
        底边 96..152（长 56）。
      负空间间距：上 104−64=40、下 192−152=40、左 96−64=32、右 192−124=68。
    v4: 前面三稿的角度都算错了 —— v3 里我把"底角 75°"当成顶角 30°，实际顶角 87.6°，
        比标准播放键钝得多，显得发闷。按 tan(θ/2)=半底/高 反算后取 60.5°。
    黑白先行；颜色留到 Phase 7。
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M40 40 H216 V168 H192 V64 H64 V216 H40 Z
    M96 104 L124 128 L96 152 Z
  " />
</svg>

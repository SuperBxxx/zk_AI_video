</g><text x="748.667" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">16px</text><text x="592.6666666666667" y="636" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">B · 框与三角</text><text x="592.6666666666667" y="670" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">画框右下角开放，框内三角指向出口。</text><rect x="1065.33" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t" viewBox="0 0 256 256" x="1095.33" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet">
  <title id="c2-t">住凯AI视频 — concept C · 叠帧</title>
  <!--
    Concept C — 叠帧 (Stacked Frames) · abstract
    Idea: 三个画框沿对角线逐级错位，最完整的一个在右下 ——
          走过的分镜叠在一起，当前这一格是完整的。
    构造:
      三个 128×128 方框，位置 (48,48) (88,88) (128,128)，每级位移 40。
      三框描边统一 32（= 位移 40 的 4/5）—— 粗细一致是这类几何标记的底线，
      v3 里前两框 40、第三框 24，尺寸不一，属手工错误。
      位移 40 > 描边 32，因此三框互不相交，各自写"外框 + 内孔"的复合路径即可。
      外沿 48..232；左右留白 48 / 24（右下是视觉出口，略偏即可）。
    v4: v3 三个环的描边不一致（40/40/24）。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000" fill-rule="evenodd">
    <path d="M48 48 H176 V80 H80 V176 H48 Z M80 80 H144 V144 H80 Z" />
    <path d="M88 88 H216 V120 H120 V216 H88 Z M120 120 H184 V184 H120 Z" />
    <path d="M128 128 H232 V160 H160 V232 H128 Z M160 160 H200 V200 H160 Z" />
  </g>
</svg>
</g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t" viewBox="0 0 256 256" x="1095.33" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet">
  <title id="s264-t">住凯AI视频 — concept C · 叠帧</title>
  <!--
    Concept C — 叠帧 (Stacked Frames) · abstract
    Idea: 三个画框沿对角线逐级错位，最完整的一个在右下 ——
          走过的分镜叠在一起，当前这一格是完整的。
    构造:
      三个 128×128 方框，位置 (48,48) (88,88) (128,128)，每级位移 40。

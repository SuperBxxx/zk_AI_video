      外沿 48..208。
      亻竖 x48..72 y104..208；短撇为 45° 平行四边形接在竖顶。
      主：点 x112..152 y48..72（居中于中竖）；上横 x96..208 y80..104；
          中横 x96..184 y128..152；竖 x152..176 y48..208。
    v2: v1 的「主」只有两横，右半边读作「干」。现补上"点 + 上横"，
        「主」的骨架完整（点 · 上横 · 中横 · 竖）。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000">
    <!-- 亻：竖 -->
    <rect x="48" y="104" width="24" height="104" />
    <!-- 亻：撇（45°） -->
    <path d="M48 104 L72 80 L88 96 L64 120 Z" />
    <!-- 主：点 -->
    <rect x="112" y="48" width="40" height="24" />
    <!-- 主：上横 -->
    <rect x="96" y="80" width="112" height="24" />
    <!-- 主：中横 -->
    <rect x="96" y="128" width="88" height="24" />
    <!-- 主：竖 -->
    <rect x="152" y="48" width="24" height="160" />
  </g>
</svg>

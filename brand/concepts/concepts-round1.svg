<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="840" viewBox="0 0 1600 840"><defs><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="1600" height="840" fill="#f7f7f4"/><text x="60" y="78" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#161616">住凯AI视频 — logo 概念（第 1 轮）</text><text x="60" y="116" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#6b6b6b">Concepts for review — pick a direction (or tell me what you like in each).</text><rect x="60" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t" viewBox="0 0 256 256" x="90" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet">
  <title id="c0-t">住凯AI视频 — concept A · 住字标</title>
  <!--
    Concept A — 住 (geometric monogram) · letterform
    Idea: 把「住」压成纯几何块面。左偏旁「亻」= 一根竖 + 一道短撇；
          右旁「主」= 点、两横、一竖。看的人不一定逐笔认出，但会读到"一个方块字"，
          而方块字 + 方画布正是这个产品的底色。
    构造:
      笔画厚度统一 24（256 的 3/32；16px 下约 1.5px，仍可见）。直角，与画布硬边一致。
      外沿 48..208。
      亻竖 x48..72 y104..208；短撇为 45° 平行四边形接在竖顶。
      主：点 x112..152 y48..72（居中于中竖）；上横 x96..208 y80..104；
          中横 x96..184 y128..152；竖 x152..176 y48..208。
    v2: v1 的「主」只有两横，右半边读作「干」。现补上"点 + 上横"，
        「主」的骨架完整（点 · 上横 · 中横 · 竖）。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000">
    <!-- 亻：竖 -->
    <rect x="48" y="104" width="24" height="104" />
    <!-- 亻：撇（45°） -->
    <path d="M48 104 L72 80 L88 96 L64 120 Z" />
    <!-- 主：点 -->
    <rect x="112" y="48" width="40" height="24" />
    <!-- 主：上横 -->
    <rect x="96" y="80" width="112" height="24" />
    <!-- 主：中横 -->
    <rect x="96" y="128" width="88" height="24" />
    <!-- 主：竖 -->
    <rect x="152" y="48" width="24" height="160" />
  </g>
</svg>
</g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t" viewBox="0 0 256 256" x="90" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet">

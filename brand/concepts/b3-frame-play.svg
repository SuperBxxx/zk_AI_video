<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept B · 框与三角</title>
  <!--
    Concept B — 框与三角 (Frame & Play) · abstract
    Idea: 一个画框，右下角**整段缺席**——画布是开放的、没有边界；框内切出一个
          视频三角，向右指向那个开口："从想法到成片"的出口。
    构造:
      外框 40..216，边宽 24。右下角缺口：底边止于 x184，右边止于 y168，
      缺口长 32（= 边宽 24 的 4/3，够大才读得出）。
      三角为等腰，顶角精确 30°：底 x96 竖直，y80..176（高 96）；
        顶点 (96 + 96·tan15°, 128) = (96 + 25.7, 128) ≈ (122,128)，
        取 122 保持整数坐标。斜边与水平线成 15° 的整数倍关系，
        避免审计报出的"差一点角度"（那是 AI 画标记最爱犯的手工痕迹）。
      负空间间距：三角上 80−64=16、下 192−176=16、左 96−64=32、右 192−122=70。
    v2: v1 缺口只有 24（几乎看不见），且三角斜边是 29.1°（差一点角度）。
    v3: v2 声称顶角 30°，但底 72 / 半宽 69 的实际顶角是 2·atan(69/72) ≈ 87.6°，
        根本不是 30°（我在注释里把 46.2° 的底角当成了顶角）。
        现在按 tan(15°) 反算：高 96 → 半宽 25.7（取 26，顶角 30.6°，落在干净区间）。
    黑白先行；颜色留到 Phase 7。 -->
  <path fill="#000" fill-rule="evenodd" d="
    M40 40 H216 V168 H192 V64 H64 V216 H40 Z
    M96 80 L122 128 L96 176 Z
  " />
</svg>

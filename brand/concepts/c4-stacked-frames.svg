<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept C · 叠帧</title>
  <!--
    Concept C — 叠帧 (Stacked Frames) · abstract
    Idea: 三个画框沿对角线逐级错位，最完整的一个在右下 ——
          走过的分镜叠在一起，当前这一格是完整的。
    构造:
      三个 128×128 方框，位置 (48,48) (88,88) (128,128)，即每级位移 40。
      每框描边 24 —— 位移 40 > 描边 24，因此三框**互不相交**（v2 我误以为相交，
      手写并集路径，结果把孔洞填错、成了一团黑块）。
      现在每框各写一个"外框 + 内孔"的复合路径（even-odd），三层独立、不会互相压叠。
      外沿 48..232；四边留白 48/24。
    v3: v2 用手写并集路径表达"相交成整体"，但几何上并不相交，路径是错的。
        改为三个独立的环，构造正确且更简单。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000" fill-rule="evenodd">
    <!-- 第 1 帧（最远） -->
    <path d="M48 48 H176 V88 H88 V176 H48 Z M88 88 H136 V136 H88 Z" />
    <!-- 第 2 帧 -->
    <path d="M88 88 H216 V128 H128 V216 H88 Z M128 128 H176 V176 H128 Z" />
    <!-- 第 3 帧（完整） -->
    <path d="M128 128 H232 V152 H152 V232 H128 Z M152 152 H208 V208 H152 Z" />
  </g>
</svg>

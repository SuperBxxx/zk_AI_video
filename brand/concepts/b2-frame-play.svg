<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept B · 框与三角</title>
  <!--
    Concept B — 框与三角 (Frame & Play) · abstract
    Idea: 一个画框，右下角的角**没有闭合**（框是开放的，画布是无限的），
          框内用负空间切出一个视频播放三角。三角向右指，指向那个开口 ——
          "从想法到成片"的出口。
    构造:
      外框 40..216，边宽 24。右下角的横边与竖边各缩短 24，形成开口。
      三角为等腰，底在左：顶点 (100,88) (100,168) (172,128)。
      三角到内壁的最小间距：上 88-64=24、下 192-168=24、左 100-64=36、右 192-172=20。
      全部为 8 的倍数，保证 16px 下不产生半像素毛边。
    与 youtube 的区别：那里是"实心圆角屏 + 居中三角"，这里是"直角画框 + 缺角 + 偏移三角"。
    v1。黑白先行；颜色留到 Phase 7。
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M40 40 H216 V192 H192 V64 H64 V216 H40 Z
    M100 88 L172 128 L100 168 Z
  " />
</svg>

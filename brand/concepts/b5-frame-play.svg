<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept B · 框与三角</title>
  <!--
    Concept B — 框与三角 (Frame & Play) · abstract
    Idea: 一个画框，右下角**整段缺席**——画布是开放的、没有边界；
          框内切出一个视频三角，指向那个开口："从想法到成片"的出口。
    构造:
      外框 40..216，边宽 24。右下角缺口：底边止于 x184，右边止于 y168，
      缺口长 32（= 边宽 24 的 4/3，够大才读得出）。
      三角底边在左、顶点朝右、指向缺口。顶角按 tan(θ/2) = 半底 / 高 反算：
        高 72（y92..164），半底 42 → 顶点 (138,128)，
        θ = 2·atan(42/72) = 60.5°，与标准播放键的锐度一致。
        底边 x96，长 84。
      间距留白：上 92−64=28、下 192−164=28、左 96−64=32、右 192−138=54。
        右侧刻意留更多 —— 三角指向缺口，那是"出口"，需要呼吸。
    v4: 前三稿的角度都算错了 —— v3 里我把"底角 75°"当成顶角 30°，实际顶角 87.6°，
        比标准播放键钝得多，显得发闷。
    v5: v4 的三角是 (96,104)-(124,128)-(96,152) 的小三角，左距 32 而右距 68，
        明显偏左下。现在放大并上移，四边留白收敛到 28/28/32/54。
    黑白先行；颜色留到 Phase 7。
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M40 40 H216 V168 H192 V64 H64 V216 H40 Z
    M96 92 L138 128 L96 164 Z
  " />
</svg>

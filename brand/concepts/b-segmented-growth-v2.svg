<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept B · 分节生长</title>
  <!--
    Concept B — 分节生长 (Segmented Growth) · abstract
    Idea: 三根等宽的竖条被横向节缝断开——像竹节，也像由左至右逐段推进的时间轴。
          高度递进，最后一段最短，是"从想法到成片"的那一步。
    构造: 三条宽 48、节缝 10（条宽的 1/5，16px 下仍可见）、圆角 8。
          顶端 48 / 底端 208，垂直居中；节缝位置三根各不相同，避免机械重复。
          三根条的高度 160 / 128 / 96，底部对齐 —— 视觉重量自左向右递减。
    v2: v1 底边在 224 而顶端在 56，上边距 56 / 下边距 32，整体偏低 12px。
        现在改为 48..208 居中。
    黑白先行；颜色留到 Phase 7。
  -->
  <g fill="#000">
    <!-- 第一条：最高 160 -->
    <rect x="28" y="48" width="48" height="72" rx="8" />
    <rect x="28" y="130" width="48" height="78" rx="8" />
    <!-- 第二条：128，节缝靠下 -->
    <rect x="104" y="80" width="48" height="52" rx="8" />
    <rect x="104" y="142" width="48" height="66" rx="8" />
    <!-- 第三条：96，节缝靠上，末段最短 -->
    <rect x="180" y="112" width="48" height="30" rx="8" />
    <rect x="180" y="152" width="48" height="56" rx="8" />
  </g>
</svg>

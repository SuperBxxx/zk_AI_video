<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — concept C · 叠帧</title>
  <!--
    Concept C — 叠帧 (Stacked Frames) · abstract
    Idea: 三个方框沿对角线错位叠放成一个整体，最完整的那一个在右下 ——
          走过的分镜叠在一起，当前这一格是完整的。用帧本身的几何讲序列，
          不用胶片孔、不用播放键、不用箭头。
    构造:
      三个 128×128 的方框，描边 24，位置 (48,48) (88,88) (128,128)，即每级位移 40。
      描边宽度 24 > 位移 40 的一半，因此相邻两框必然相交 —— 它们连成一个整体，
      不会被读成三个分开的括号（这正是 v1 的失败之处）。
      路径写成"外边界 + 内孔"两条子路径 + even-odd：相交处自动并成实心，
      避免三块黑色互相压叠产生接缝。
      外沿 48..232；留白上下 48 / 24，因右下是视觉出口，略偏即可。
    v2: v1 只画了每个框的左上两段、彼此不相交，观者读成"三个左上角括号"。
    黑白先行；颜色留到 Phase 7。
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M48 48 H176 V88 H104 V160 H176 V200 H48 Z
    M88 88 H136 V128 H128 V152 H88 Z
  " />
</svg>

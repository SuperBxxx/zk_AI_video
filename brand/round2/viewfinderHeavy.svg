<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 变体 D · 准星取景（加厚）</title>
  <!--
    变体 D — 准星取景（加厚） · geometric reduction

    解决：C 的四角厚 24，16px 下偏薄；且十字准星容易被读成枪械瞄准镜。

    改动：
      1. 四角厚 24 → 32，臂长 64 → 72。加厚后 16px 约 2px，抗糊。
      2. 准星由"十字"改为"**中心点 + 上下两段**"，去掉水平臂 ——
         无水平交叉线就不会读成瞄准镜；保留垂直轴心，仍指向画面中心。
      3. 中心点与上下段之间留出负空间环，使中心"亮"起来。

    构造:
      四角：臂长 72、厚 32，外沿 32..224，各边留 80 的缺口
      中心：点 24×24 于正中 (116,116)；
            上段 x116..140 y72..96；下段 x116..140 y160..184
      全部为 8 的倍数。
  -->
  <g fill="#000">
    <!-- 左上 -->
    <rect x="32" y="32" width="72" height="32" />
    <rect x="32" y="64" width="32" height="48" />
    <!-- 右上 -->
    <rect x="152" y="32" width="72" height="32" />
    <rect x="192" y="64" width="32" height="48" />
    <!-- 左下 -->
    <rect x="32" y="192" width="72" height="32" />
    <rect x="32" y="144" width="32" height="48" />
    <!-- 右下 -->
    <rect x="152" y="192" width="72" height="32" />
    <rect x="192" y="144" width="32" height="48" />
    <!-- 中心点 -->
    <rect x="116" y="116" width="24" height="24" />
    <!-- 中心上段 / 下段（无水平臂，避免瞄准镜联想） -->
    <rect x="116" y="72" width="24" height="24" />
    <rect x="116" y="160" width="24" height="24" />
  </g>
</svg>

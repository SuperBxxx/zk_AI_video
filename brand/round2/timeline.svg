<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 候选 1 · 时间轴</title>
  <!--
    候选 1 — 时间轴 (Timeline) · abstract gesture

    Idea: 视频的本质是"沿时间排列的一帧帧"。用一条基线与三根不等宽竖条表达这段
          序列；中间那根**单独抬升到基线之上**并更窄，读作**关键帧**。
          这一笔是它与通用柱状图的唯一区别，也是整个符号的全部智慧所在。

    刻意回避：
      · 不用方框 —— 方框表示"有界"，而产品卖点是"无限画布"，语义相反
      · 不用播放三角 —— 那属于播放器，不属于创作工具

    构造:
      基线 y=166..182（厚 16），x 32..224
      三根竖条宽 32，间距 32，底部贴基线顶 166：
        左  x44   y78..166   （高 88，最长 = 起点铺垫）
        中  x108  y110..166  （高 56，最短）
        右  x172  y62..166   （高 104，最长）
      关键帧：把中条改为**悬浮在基线之上**，不贴基线：
        中  x108  y100..146  （高 46，与基线留出 20 的间隙）
      基线两端超出竖条范围（32 / 224 对 44 / 204），保留"时间在延续"的暗示。

    尺寸全是 4 的倍数，16px 下不产生半像素毛边。
  -->
  <g fill="#000">
    <!-- 基线 -->
    <rect x="32" y="166" width="192" height="16" />
    <!-- 左：铺垫 -->
    <rect x="44" y="78" width="32" height="88" />
    <!-- 中：关键帧（悬浮，不贴基线） -->
    <rect x="108" y="100" width="32" height="46" />
    <!-- 右：高潮 -->
    <rect x="172" y="62" width="32" height="104" />
  </g>
</svg>

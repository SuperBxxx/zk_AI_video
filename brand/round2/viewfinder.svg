<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 候选 3 · 取景框</title>
  <!--
    候选 3 — 取景框 (Viewfinder) · geometric reduction

    Idea: 四角直角 + 中心十字准星。四角只到该到的地方就停（边留缺口），
          因此读作"正在框取一个比画面更大的东西" —— 这正好是无限画布。
          十字准星把它从"裁切标记"拉向"取景器"：一眼看出是"看"和"框"。

    构造:
      四角直角：臂长 64、厚 24，各留 96 的缺口
        左上 x32..96  y32..56 / x32..56  y56..96
        右上 x160..224 y32..56 / x200..224 y56..96
        左下 x32..96  y200..224 / x32..56 y160..200
        右下 x160..224 y200..224 / x200..224 y160..200
      中心准星：细十字 + 中心空环（负空间），厚 16、臂长 44
        横 x84..172 y120..136，竖 x120..136 y84..172
        中心以 24 为半径挖空 → 用 4 段矩形代替，保证仍是填充面
      整体 192 见方，留白 32。

    刻意回避：不做闭合画框（那表示"有界"），不做播放三角（属播放器）。
  -->
  <g fill="#000">
    <!-- 左上角 -->
    <rect x="32" y="32" width="64" height="24" />
    <rect x="32" y="56" width="24" height="40" />
    <!-- 右上角 -->
    <rect x="160" y="32" width="64" height="24" />
    <rect x="200" y="56" width="24" height="40" />
    <!-- 左下角 -->
    <rect x="32" y="200" width="64" height="24" />
    <rect x="32" y="160" width="24" height="40" />
    <!-- 右下角 -->
    <rect x="160" y="200" width="64" height="24" />
    <rect x="200" y="160" width="24" height="40" />
    <!-- 中心准星：四段，中间留空环 -->
    <rect x="84" y="120" width="30" height="16" />
    <rect x="142" y="120" width="30" height="16" />
    <rect x="120" y="84" width="16" height="30" />
    <rect x="120" y="142" width="16" height="30" />
  </g>
</svg>

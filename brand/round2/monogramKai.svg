<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 候选 2 · 凯字标</title>
  <!--
    候选 2 — 凯字标 (Monogram 凯) · letterform-derived

    Idea: 把「凯」压成纯几何块面。左「岂」保留「山」的三根立柱与一条底横；
          右「几」保留竖笔与底部**钩**。钩是「凯」最具辨识的一笔，
          整块面的性格由它决定。

    为什么是「凯」而不是「住」：
      · 「住」的骨架接近"亻 + 主线"，压平后与任意字标都容易撞
      · 「凯」含「山」的叠层与「几」的钩，笔画关系更独特，独占比更高
      · 「凯」是品牌名里更有力量感的那个字

    构造:
      笔画厚统一 24。外沿 x 44..212、y 40..216。
      山：三根立柱自底横向上生长，高度不一 ——
          左 x44  y104..184（高 80，最短）
          中 x84  y56..184 （高 128，最高，形成"主峰"）
          右 x124 y88..184 （高 96，中等）
          底横 x44..156  y184..208
      几：竖笔 x156..180  y40..184
          钩：自竖笔底端向右再向下 —— 用直角折线，保持与整体的方正一致
              x156..212  y184..208（右伸）
              x188..212  y136..208（下探，形成钩的"钩尖"）
      两部件在 x156..180 一带贴合，留 0 间隙，使其读作一个字而非两个符号。
  -->
  <g fill="#000">
    <!-- 岂 · 山：三根立柱 -->
    <rect x="44" y="104" width="24" height="80" />
    <rect x="84" y="56" width="24" height="128" />
    <rect x="124" y="88" width="24" height="96" />
    <!-- 岂 · 山：底横 -->
    <rect x="44" y="184" width="112" height="24" />
    <!-- 几：竖笔 -->
    <rect x="156" y="40" width="24" height="144" />
    <!-- 几：底部横伸 -->
    <rect x="156" y="184" width="56" height="24" />
    <!-- 几：钩（下探的竖） -->
    <rect x="188" y="136" width="24" height="72" />
  </g>
</svg>

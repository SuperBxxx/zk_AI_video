<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 变体 F · 扩张角</title>
  <!--
    变体 F — 扩张角 (Expanding Corners) · abstract gesture

    解决：C 的四角是等宽直角，静止、像裁切标记。

    改动：每个角的内端**斜切 45°**，使直角变成"向外张开的楔形"——
    读作"框正在展开"，把"无限画布"从静止状态变成主动动作。
    斜切方向统一朝外，四个角因此有共同的方向感。

    构造:
      每角由两条**带 45° 斜端的条**组成，直角厚度 32。
      左上角：横条 x32..104 y32..64，右端斜切；竖条 x32..64 y64..136，下端斜切
        横条路径 M32 32 H104 L72 64 H32 Z   （右端自 (104,32) 斜到 (72,64)）
        竖条路径 M32 64 H64 V136 L32 104 Z  （下端自 (64,136) 斜到 (32,104)）
      其余三角镜像同理。斜切量固定 32，等于条厚，因此斜角恒为 45°。
      内沿 72..184，中心留空 112 见方，不再加准星 —— 让"张开"本身成为唯一动作。
  -->
  <g fill="#000">
    <!-- 左上 -->
    <path d="M32 32 H104 L72 64 H32 Z" />
    <path d="M32 64 H64 V136 L32 104 Z" />
    <!-- 右上 -->
    <path d="M152 32 H224 V64 H192 Z" transform="translate(0,0)" />
    <path d="M224 64 V136 L192 104 H224 Z" />
    <!-- 左下 -->
    <path d="M32 192 H104 L72 224 H32 Z" />
    <path d="M32 120 H64 V192 H32 Z" />
    <!-- 右下 -->
    <path d="M152 192 H224 V224 H192 Z" />
    <path d="M224 120 V192 H192 L224 160 Z" />
  </g>
</svg>

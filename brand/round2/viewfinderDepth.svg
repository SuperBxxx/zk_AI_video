<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">住凯AI视频 — 变体 E · 明暗对角</title>
  <!--
    变体 E — 明暗对角 (Depth Diagonals) · abstract gesture

    解决：C 的四角等长等重，读起来像"裁切标记"——四边对称、没有朝向。

    改动：让**对角两角更重更长**，另两角收短收轻，制造纵深与朝向：
      左上 / 右下 = 主导角（臂长 80、厚 32）
      右上 / 左下 = 收短角（臂长 48、厚 20）
    加上中心一个小方点作为**视觉落点**，把视线锁在中间。

    为什么是"左上→右下"这一条对角：与界面里"从左上开始、往右下推进"的阅读
    与画布流向一致（画布节点也是自左上向右下铺开）。

    构造:
      主导角 外沿 32..112（臂 80）、厚 32
      收短角 外沿 144..192（臂 48）、厚 20
      中心点 32×32 于 (112,112)
  -->
  <g fill="#000">
    <!-- 主导：左上 -->
    <rect x="32" y="32" width="80" height="32" />
    <rect x="32" y="64" width="32" height="48" />
    <!-- 主导：右下 -->
    <rect x="144" y="192" width="80" height="32" />
    <rect x="192" y="144" width="32" height="48" />
    <!-- 收短：右上（厚 20） -->
    <rect x="144" y="32" width="48" height="20" />
    <rect x="192" y="52" width="20" height="40" />
    <!-- 收短：左下（厚 20） -->
    <rect x="32" y="204" width="48" height="20" />
    <rect x="32" y="164" width="20" height="40" />
    <!-- 中心落点 -->
    <rect x="112" y="112" width="32" height="32" />
  </g>
</svg>
